name: Build Android APK - Biplob Adalat

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Generate Native Android Project Files & Set Target SDK & Internet Permission
      run: |
        flutter create --org com.biplobadalat.app --project-name biplob_adalat temp_project
        cp -r temp_project/android ./android
        rm -rf temp_project
        
        # Configure minSdkVersion 21 & targetSdkVersion 36 in build.gradle
        sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
        sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
        
        # Add Internet Permission to AndroidManifest.xml automatically
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

    - name: Install Dependencies
      run: flutter pub get

    -     - name: Setup App Icon and App Name
      run: |
        # ১. অ্যাপ আইকন জেনারেটরের প্যাকেজ যোগ
        flutter pub add flutter_launcher_icons --dev
        
        # ২. pubspec.yaml-এ আইকন কনফিগারেশন লেখা (ios: false করা হয়েছে)
        cat <<EOF >> pubspec.yaml

        flutter_launcher_icons:
          android: true
          ios: false
          image_path: "assets/images/app_icon.png"
        EOF

        # ৩. আইকন জেনারেট করা
        flutter pub run flutter_launcher_icons

        # ৪. অ্যান্ড্রয়েড ফোনে ইনস্টল নাম Biplob Dhaka Court করা
        sed -i 's/android:label=".*"/android:label="Biplob Dhaka Court"/' android/app/src/main/AndroidManifest.xml
        

    - name: Build APK with Secret Key
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_KEY

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Biplob-Adalat-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
